# Git repositories chezmoi clones into the home directory and pulls once a
# week. These are not packaged for apt and are not tools mise can install: one
# is a zsh theme that is sourced, the other a directory of scripts.

# The zsh prompt theme. .zshrc sources it from here.
[".local/share/powerlevel10k"]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k.git"
    refreshPeriod = "168h"
    [".local/share/powerlevel10k".clone]
        args = ["--depth=1"]

# Personal command-line utilities. .zshenv puts its bin directory on PATH.
[".local/share/jcouball-scripts"]
    type = "git-repo"
    url = "https://github.com/jcouball/scripts.git"
    refreshPeriod = "168h"
