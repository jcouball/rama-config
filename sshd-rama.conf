# sshd settings for rama. Managed: script 09 copies this file to
# /etc/ssh/sshd_config.d/00-rama.conf on `chezmoi apply`, and an edit made
# there is overwritten by the next one. Change this file instead.
#
# Only what differs from Ubuntu's sshd_config, which includes the drop-in
# directory before it sets anything. sshd keeps the first value it reads for a
# keyword, so these win over that file, and the 00- prefix puts them ahead of
# any other drop-in. README.md, "Remote access over SSH", has the reasoning.

# Keys only. A session logs in as james, who has sudo and is in the docker
# group, so ~/.ssh/authorized_keys is the only way in: no passwords, no
# host-based login, no certificates. AuthenticationMethods makes that true
# whatever the per-method settings say. Kerberos (GSSAPI) is not listed:
# Ubuntu's sshd is built without it and warns about the keyword.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
HostbasedAuthentication no
TrustedUserCAKeys none
AuthorizedPrincipalsFile none
AuthorizedKeysFile .ssh/authorized_keys

# root has no key file and never logs in over ssh. Use sudo from a session.
PermitRootLogin no

# No forwarding of any kind: ports, agent, X11, Unix sockets or tunnels. A
# key line's `restrict` says the same, and no key option can override this.
DisableForwarding yes
