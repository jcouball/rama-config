# Global mise configuration: language runtimes, and the command-line tools
# that neither the Ubuntu archive nor a vendor apt repository provides.
#
# Before adding a tool here, check `apt-cache policy name`. If Ubuntu carries
# it, it belongs in apt-packages.txt.
#
# Script 04 runs `mise install` whenever this file changes.

[tools]
# Language runtimes, pinned to exact versions. A project that needs a different
# version sets it in its own mise.toml or .tool-versions.
go = "1.27.2"
node = "26.12.0"
python = "3.15.0"
ruby = "4.0.7"
rust = "1.99.0"

# Tools in mise's registry. `latest` means `mise upgrade` (and so topgrade)
# moves them forward.
actionlint = "latest"
chezmoi = "latest"
dive = "latest"
goreleaser = "latest"
lychee = "latest"
minio = "latest"
prettier = "latest"
task = "latest"
topgrade = "latest"
uv = "latest"
vale = "latest"

# npm packages, installed with the Node above.
"npm:@github/copilot" = "latest"
"npm:markdownlint-cli" = "latest"

# A Python package, run in its own environment by uv. The registry's checkov
# entry downloads a release binary that is not published for every
# architecture.
"pipx:checkov" = "latest"

# Not in mise's registry: installed from the project's GitHub releases.
"github:danvergara/dblab" = "latest"
"github:foriequal0/git-trim" = "latest"
"github:harehare/mq" = "latest"
